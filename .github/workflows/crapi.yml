name: crAPI validation

# Heavy, opt-in validation against the full OWASP crAPI stack.
# NOT wired into the per-PR CI (ci.yml) so normal merges stay fast.
# Runs on demand (Actions -> "crAPI validation" -> Run workflow) and weekly.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"   # every Monday 03:00 UTC

concurrency:
  group: crapi-validation
  cancel-in-progress: true

jobs:
  crapi-scan:
    name: Full validation against crAPI
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout apistrike
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install WeasyPrint system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangocairo-1.0-0 libpangoft2-1.0-0 \
            libharfbuzz0b libgdk-pixbuf-2.0-0 libcairo2 libffi-dev \
            shared-mime-info fonts-dejavu-core

      - name: Install apistrike dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Clone crAPI
        run: |
          git clone --depth 1 https://github.com/OWASP/crAPI.git ../crapi
          echo "crAPI cloned"

      - name: Start crAPI stack
        working-directory: ../crapi/deploy/docker
        run: |
          docker compose pull --quiet || true
          docker compose up -d
          echo "Waiting for crAPI gateway on :8888 ..."
          up=0
          for i in $(seq 1 90); do
            if curl -fsS -o /dev/null http://localhost:8888/; then
              echo "Gateway is up after ~$((i*10))s"; up=1; break
            fi
            sleep 10
          done
          if [ "$up" -ne 1 ]; then
            echo "crAPI did not become ready in time"
            docker compose ps
            docker compose logs --tail=200
            exit 1
          fi

      - name: Generate + patch scope for crAPI
        run: |
          python -m apistrike init-scope --path scope.crapi.yaml --force
          echo "----- generated scope schema (for reference) -----"
          cat scope.crapi.yaml
          echo "--------------------------------------------------"
          python scripts/crapi_patch_scope.py scope.crapi.yaml
          echo "----- patched scope -----"
          cat scope.crapi.yaml

      - name: Seed a crAPI user + capture login response
        run: |
          python scripts/crapi_seed.py | tee crapi_seed.out

      - name: Unauthenticated module sweep
        run: |
          set +e
          BASE=http://localhost:8888
          python -m apistrike run-module --list
          echo "== misconfig ==";  python -m apistrike misconfig  "$BASE" --scope scope.crapi.yaml
          echo "== inventory ==";  python -m apistrike inventory  "$BASE" --scope scope.crapi.yaml
          echo "== crawl ==";      python -m apistrike crawl      "$BASE" --scope scope.crapi.yaml
          echo "== ratelimit ==";  python -m apistrike ratelimit  "$BASE" --scope scope.crapi.yaml
          echo "== dataexpose =="; python -m apistrike dataexpose "$BASE" --scope scope.crapi.yaml
          echo "== ssrf ==";       python -m apistrike ssrf       "$BASE" --path / --param url --no-oast --scope scope.crapi.yaml
          echo "== graphql ==";    python -m apistrike graphql    "$BASE" --scope scope.crapi.yaml
          set -e

      - name: Authenticated scan (best-effort, non-fatal)
        run: |
          set +e
          BASE=http://localhost:8888
          EMAIL=$(sed -n 's/^EMAIL=//p' crapi_seed.out)
          PASS=$(sed -n 's/^PASSWORD=//p' crapi_seed.out)
          echo "Authenticating as $EMAIL via /identity/api/auth/login"
          python -m apistrike scan "$BASE" --scope scope.crapi.yaml \
            -u "$EMAIL" -p "$PASS" --login-path /identity/api/auth/login --login-field email
          set -e

      - name: Render reports
        run: |
          set +e
          python -m apistrike report -f html
          python -m apistrike report -f pdf
          python -m apistrike ai-report -f html
          set -e

      - name: Collect crAPI compose logs
        if: always()
        working-directory: ../crapi/deploy/docker
        run: docker compose logs --tail=400 > ../../../apistrike/crapi-compose.log 2>&1 || true

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apistrike-crapi-validation
          path: |
            reports/
            findings.db
            scope.crapi.yaml
            crapi_seed.out
            crapi-compose.log
          if-no-files-found: warn

      - name: Tear down crAPI
        if: always()
        working-directory: ../crapi/deploy/docker
        run: docker compose down -v || true
