name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install WeasyPrint system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangocairo-1.0-0 libpangoft2-1.0-0 \
            libharfbuzz0b libgdk-pixbuf-2.0-0 libcairo2 libffi-dev \
            shared-mime-info fonts-dejavu-core

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run test suite
        run: pytest -q

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: apistrike:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the entrypoint
        run: docker run --rm apistrike:ci --help

  lab-scan:
    name: Live scan against VAmPI
    runs-on: ubuntu-latest
    needs: test
    services:
      vampi:
        image: erev0s/vampi:latest
        ports:
          - 5000:5000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install WeasyPrint system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangocairo-1.0-0 libpangoft2-1.0-0 \
            libharfbuzz0b libgdk-pixbuf-2.0-0 libcairo2 libffi-dev \
            shared-mime-info fonts-dejavu-core

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Wait for VAmPI, then seed its database
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:5000/ >/dev/null 2>&1; then
              echo "VAmPI is up"; break
            fi
            echo "waiting for VAmPI ($i/30)..."; sleep 2
          done
          curl -fsS http://localhost:5000/ || (echo 'VAmPI did not become ready' && exit 1)
          curl -fsS http://localhost:5000/createdb || true

      - name: Create authorized scope for the lab
        run: |
          python -m apistrike init-scope --path scope.yaml --force
          echo '----- scope.yaml -----'
          cat scope.yaml

      - name: Run a scan against VAmPI (authorized lab)
        run: |
          python -m apistrike scan http://localhost:5000 \
            --scope scope.yaml -u name1 -p pass1

      - name: Render reports from the findings DB
        run: |
          python -m apistrike report --format html
          python -m apistrike report --format pdf
          ls -la reports/

      - name: Upload scan artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apistrike-lab-reports
          path: |
            reports/report.html
            reports/report.pdf
            findings.db
          if-no-files-found: warn
